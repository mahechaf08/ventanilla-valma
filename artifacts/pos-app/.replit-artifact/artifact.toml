kind = "web"
previewPath = "/"
title = "Ventanilla Valma POS"
version = "1.0.0"
id = "artifacts/pos-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22570

[services.development]
run = "pnpm --filter @workspace/pos-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pos-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/pos-app/dist"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22570"
BASE_PATH = "/"
